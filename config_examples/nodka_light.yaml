# Merge this block into the active settings YAML. Paths are relative to cwd.
# Verify the controller model, Linux serial port, and actual connected channel first.
light:
  enabled: false
  library_path: third_party/nodka/lib/libagv_nodka_light.so
  config_path: third_party/nodka/config/nkio_config.ini
  port: null
  channel_mask: null  # CH0=1, CH1=2, CH2=4, CH3=8
  brightness: 50
  settle_ms: 100
# When enabled online, camera.vendor must be hikvision;
# camera.auto_exposure must be false and camera.exposure must be positive (MVS us).
