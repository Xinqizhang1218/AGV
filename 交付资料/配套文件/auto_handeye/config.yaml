# 从 pkg5_260728 运行：python auto_handeye/main.py --help
# 无参数只预览；--self-test 完全离线；--capture-current 只采当前点。
# 自动运动：--run --execute，且必须完成以下现场配置。
# 所有路径相对本配置文件。图像目录必须与视觉服务共享。
vision:
  base_url: http://127.0.0.1:8088
  settings_path: ../agv_vision/config/settings_online.yaml
  server_image_dir: ""   # 服务端绝对路径，例如 /app/auto_handeye/outputs/images
  local_image_dir: ""    # 同一目录在本程序主机的绝对路径
  timeout_s: 20.0
  discard_frames: 2
  settings_match_confirmed: false # 确认本地配置与在线服务板型、内参、相机一致
  fresh_capture_confirmed: false  # 确认服务返回到位后的新帧（丢帧本身不能证明）
motion:
  ip: ""  # PLC IP
  port: 502
  io_timeout_s: 3.0
  motion_timeout_s: 60.0
  poll_s: 0.1
  stable_s: 1.0
  position_tolerance_m: 0.0003
  rotation_tolerance_deg: 0.15
  single_pose_handshake_confirmed: false # D1002仅执行目标，清零后原地保持
  flange_pose_confirmed: false # D100实际/D1020目标均为基座下法兰m/rad，RzRyRx
  exclusive_control_confirmed: false # 自动任务期间没有Java/其他程序写运动寄存器
  local_paths_verified: false # 现场已验证整个局部探索范围及点间路径
ik:
  mode: disabled # disabled=仅限已验证局部范围；arcs=官方pyaubo_sdk
  sdk_convention_confirmed: false # 核对控制器版本、基座和RzRyRx约定
  ip: ""
  port: 30004 # 按控制器SDK版本修改，不自动探测
  robot_name: ""
  username_env: AUBO_USERNAME
  password_env: AUBO_PASSWORD
  max_joint_step_deg: 15.0
limits:
  # 必填六组 [min,max]：X/Y/Z(m)、RX/RY/RZ(rad)。没有通用安全默认值。
  pose_bounds: null
  max_step_translation_m: 0.01
  max_step_rotation_deg: 4.0
  max_total_translation_m: 0.04
  max_total_rotation_deg: 18.0
planner:
  translation_step_m: 0.006
  rotation_step_deg: 3.0
  minimum_scale: 0.25
  max_attempts: 70
  max_samples: 32
  max_minutes: 25.0
  duplicate_translation_m: 0.002
  duplicate_rotation_deg: 1.0
quality:
  min_corners: 12
  min_hull_fraction: 0.015
  min_border_px: 25.0 # 估计整板外轮廓，不只是内部角点
  min_laplacian_variance: 60.0 # 在板区域计算，现场调整
  max_saturated_fraction: 0.80 # 板区域灰度>=250的比例，包含棋盘白格，现场调整
  retries: 2
calibration:
  min_training_samples: 12
  min_validation_samples: 3
  validation_every: 5 # 预先分配，验证集永远不加入拟合
  min_rotation_excitation_deg: 4.0 # 旋转向量SVD第二主方向的RMS
  max_translation_rmse_m: 0.001
  max_rotation_rmse_deg: 0.5
  max_reprojection_px: 1.0
  max_validation_translation_m: 0.002
  max_validation_rotation_deg: 0.7
  max_solution_translation_change_m: 0.001
  max_solution_rotation_change_deg: 0.3
  required_stable_updates: 3
